<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GYUGYV Portfolio">
  <meta name="theme-color" content="#f5f5f2">
  <title>GYUGYV — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f5f2;
      --text: #111111;
      --line: #c9c9c3;
      --blue: #2364ff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Manrope", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .wrap {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 76px;
      border-bottom: 1px solid var(--line);
    }

    .logo,
    .github {
      font: 500 12px/1 "DM Mono", monospace;
      letter-spacing: .06em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .github:hover { color: var(--blue); }

    .hero {
      min-height: 52vh;
      display: flex;
      align-items: flex-end;
      padding: 90px 0 58px;
    }

    h1 {
      margin: 0;
      font-size: clamp(68px, 14vw, 180px);
      font-weight: 600;
      line-height: .8;
      letter-spacing: -.08em;
    }

    .project-list {
      border-top: 1px solid var(--text);
    }

    .project {
      display: grid;
      grid-template-columns: 70px 1fr auto;
      align-items: center;
      gap: 24px;
      min-height: 152px;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      transition: padding .25s ease, background .25s ease;
    }

    .project:hover {
      padding-inline: 22px;
      background: white;
    }

    .project:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }

    .number {
      font: 400 12px/1 "DM Mono", monospace;
      color: #73736e;
    }

    .name {
      margin: 0;
      font-size: clamp(30px, 5vw, 62px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -.055em;
    }

    .url {
      display: block;
      margin-top: 10px;
      color: #73736e;
      font: 400 11px/1.4 "DM Mono", monospace;
    }

    .arrow {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid var(--text);
      border-radius: 50%;
      font: 400 20px/1 "DM Mono", monospace;
      transition: transform .25s ease, background .25s ease, color .25s ease;
    }

    .project:hover .arrow {
      transform: rotate(45deg);
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 140px;
      font: 400 11px/1.5 "DM Mono", monospace;
      text-transform: uppercase;
    }

    @media (max-width: 640px) {
      .wrap { width: calc(100% - 30px); }
      header { height: 64px; }
      .hero { min-height: 40vh; padding: 70px 0 36px; }
      h1 { font-size: clamp(54px, 19vw, 92px); }
      .project { grid-template-columns: 38px 1fr auto; gap: 10px; min-height: 120px; }
      .project:hover { padding-inline: 8px; }
      .url { font-size: 9px; }
      .arrow { width: 38px; height: 38px; font-size: 16px; }
      footer { min-height: 110px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="#">GYUGYV</a>
      <a class="github" href="https://github.com/gyugyv" target="_blank" rel="noreferrer">GitHub ↗</a>
    </header>

    <main>
      <section class="hero">
        <h1>PORT<br>FOLIO</h1>
      </section>

      <section class="project-list" aria-label="Projects">
        <a class="project" href="https://letsgather.kr/" target="_blank" rel="noreferrer">
          <span class="number">01</span>
          <span>
            <h2 class="name">Let's Gather</h2>
            <span class="url">letsgather.kr</span>
          </span>
          <span class="arrow" aria-hidden="true">↑</span>
        </a>

        <a class="project" href="https://devnew-ten.vercel.app/" target="_blank" rel="noreferrer">
          <span class="number">02</span>
          <span>
            <h2 class="name">DEVNEW</h2>
            <span class="url">devnew-ten.vercel.app</span>
          </span>
          <span class="arrow" aria-hidden="true">↑</span>
        </a>

        <a class="project" href="https://onechamp.vercel.app/" target="_blank" rel="noreferrer">
          <span class="number">03</span>
          <span>
            <h2 class="name">ONECHAMP</h2>
            <span class="url">onechamp.vercel.app</span>
          </span>
          <span class="arrow" aria-hidden="true">↑</span>
        </a>
      </section>
    </main>

    <footer>
      <span>© 2026 GYUGYV</span>
      <span>Seoul, KR</span>
    </footer>
  </div>
</body>
</html>
